name: todolistapps
description: "Aplikasi To-Do Mahasiswa dengan tema Glassmorphism."
version: 1.2.0+1
publish_to: 'none'

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.2
  path: ^1.9.1
  glassmorphism: ^3.0.0
  animate_do: ^4.2.0
  flutter_animate: ^4.5.2
  cupertino_icons: ^1.0.8
  salomon_bottom_bar: ^3.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
